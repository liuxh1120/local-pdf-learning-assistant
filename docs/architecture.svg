<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">PDF 学习问答助手架构</title>
  <desc id="desc">PDF、互联网和工具证据进入混合检索与 Agent，再由三层学习记忆持续保存和综合。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf5"/>
      <stop offset="1" stop-color="#f4f7fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#28323f" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#87909c"/>
    </marker>
    <style>
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#1d2733}
      .subtitle{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#68717d}
      .head{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#26313d}
      .body{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#606a76}
      .small{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#59626e}
      .line{stroke:#87909c;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="650" rx="28" fill="url(#bg)"/>
  <text x="64" y="66" class="title">Local PDF Learning Assistant</text>
  <text x="64" y="94" class="subtitle">本地知识库 · 混合 RAG · Agent 工具 · 可追溯三层学习记忆</text>

  <g filter="url(#shadow)">
    <rect x="64" y="145" width="220" height="86" rx="18" fill="#ffffff"/>
    <rect x="64" y="255" width="220" height="86" rx="18" fill="#ffffff"/>
    <rect x="64" y="365" width="220" height="86" rx="18" fill="#ffffff"/>
  </g>
  <text x="88" y="180" class="head">PDF 知识库</text><text x="88" y="206" class="body">解析 · 公式 · 表格 · OCR</text>
  <text x="88" y="290" class="head">互联网检索</text><text x="88" y="316" class="body">SearXNG · 学术搜索</text>
  <text x="88" y="400" class="head">MCP 工具</text><text x="88" y="426" class="body">计算 · Zotero · Anki</text>

  <g filter="url(#shadow)">
    <rect x="390" y="180" width="315" height="235" rx="24" fill="#ffffff" stroke="#f0a069" stroke-width="2"/>
  </g>
  <text x="420" y="222" class="head">混合检索与回答 Agent</text>
  <rect x="420" y="247" width="118" height="42" rx="12" fill="#fff1e7"/><text x="444" y="273" class="small">BGE-M3</text>
  <rect x="552" y="247" width="118" height="42" rx="12" fill="#fff1e7"/><text x="584" y="273" class="small">BM25</text>
  <rect x="420" y="302" width="118" height="42" rx="12" fill="#fff1e7"/><text x="442" y="328" class="small">GraphRAG</text>
  <rect x="552" y="302" width="118" height="42" rx="12" fill="#fff1e7"/><text x="576" y="328" class="small">Reranker</text>
  <text x="420" y="380" class="body">DeepSeek 生成带 [P/G/W/N/M/T] 引用的回答</text>

  <path class="line" d="M284 188 C330 188 340 240 390 240"/>
  <path class="line" d="M284 298 L390 298"/>
  <path class="line" d="M284 408 C330 408 340 355 390 355"/>

  <g filter="url(#shadow)">
    <rect x="805" y="132" width="330" height="116" rx="22" fill="#fff4ea" stroke="#f36f21" stroke-width="2"/>
    <rect x="805" y="270" width="330" height="116" rx="22" fill="#fffaf5" stroke="#d49a66" stroke-width="2"/>
    <rect x="805" y="408" width="330" height="116" rx="22" fill="#f8f9fb" stroke="#7f858e" stroke-width="2"/>
  </g>
  <text x="835" y="171" class="head">L3 · 跨会话综合</text>
  <text x="835" y="199" class="body">滚动摘要 · 课程画像 · 薄弱点与偏好</text>
  <text x="835" y="224" class="small">SQLite · 有证据才更新</text>
  <text x="835" y="309" class="head">L2 · 可检索学习事实</text>
  <text x="835" y="337" class="body">问答与笔记原子化 · 文件夹/会话作用域</text>
  <text x="835" y="362" class="small">Qdrant 向量 + SQLite 元数据</text>
  <text x="835" y="447" class="head">L1 · 仅追加学习事件</text>
  <text x="835" y="475" class="body">资料导入 · 提问 · 笔记 · 画像更新</text>
  <text x="835" y="500" class="small">完整来源链与时间线</text>

  <path class="line" d="M705 298 C750 298 760 328 805 328"/>
  <path class="line" d="M970 408 L970 386"/>
  <path class="line" d="M970 270 L970 248"/>
  <path class="line" d="M805 190 C755 190 760 252 705 252"/>

  <rect x="390" y="470" width="315" height="64" rx="18" fill="#25313d"/>
  <text x="418" y="497" style="font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#fff">隐私边界</text>
  <text x="418" y="519" style="font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#dfe5eb">PDF、索引、历史与记忆默认保存在本机</text>
  <text x="64" y="605" class="subtitle">概念参考 memU 三层模型，并针对学习工作流进行独立实现与扩展。</text>
</svg>
