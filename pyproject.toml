[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-pdf-learning-assistant"
version = "0.1.0"
description = "面向数学统计学习的本地 PDF 问答助手"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "gradio>=5.49,<7",
  "openai>=1.75,<3",
  "python-dotenv>=1.0,<2",
  "pymupdf>=1.25,<2",
  "qdrant-client>=1.13,<2",
  "sentence-transformers>=3.4,<6",
  "rank-bm25>=0.2.2,<1",
  "jieba>=0.42.1,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "mcp>=1.29,<2",
  "sympy>=1.13,<2",
  "scipy>=1.15,<2",
  "pandas>=2.2,<4",
  "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
